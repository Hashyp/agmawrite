[package]
name = "agmawrite"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "canvas", "markdown"] }
notify = "8"
pulldown-cmark = "0.12"
rfd = "0.15"
unicode-segmentation = "1"

# Focused Iced patches for opt-in per-line height and matching editor geometry.
# Markdown paragraph policy stays in src/highlight.rs; see vendor/README.md.
[patch.crates-io]
iced_core = { path = "vendor/iced_core" }
iced_graphics = { path = "vendor/iced_graphics" }
