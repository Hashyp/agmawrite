[package]
name = "agmawrite"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "canvas", "markdown"] }
notify = "8"
pulldown-cmark = "0.12"
rfd = "0.15"
unicode-segmentation = "1"

# agmawrite fork of iced_graphics: the source editor lays blank lines out
# taller, visually separating Markdown paragraphs (see
# vendor/iced_graphics/src/text/editor.rs).
[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
